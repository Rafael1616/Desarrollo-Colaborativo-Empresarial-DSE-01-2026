<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d6efd;
            --dark: #0f1117;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            padding: 40px 16px;
        }

        h2 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 2.5rem;
            color: var(--dark);
            letter-spacing: -1px;
            line-height: 1.1;
        }

        h2 span { color: var(--primary); }

        .wrapper { max-width: 1000px; margin: 0 auto; }

        .header {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .subtitle { font-size: 0.95rem; color: #64748b; }

        /* BUSCADOR */
        .buscador-wrap {
            margin-bottom: 16px;
            position: relative;
        }

        .buscador-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        #busqueda {
            width: 100%;
            padding: 11px 14px 11px 42px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            font-size: 0.93rem;
            font-family: 'DM Sans', sans-serif;
            background: white;
            transition: border 0.2s;
        }

        #busqueda:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13,110,253,0.1);
        }

        /* TABLA */
        .card-tabla {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            overflow: hidden;
        }

        .card-tabla table { width: 100%; border-collapse: collapse; }
        .card-tabla thead { background: var(--dark); color: white; }

        .card-tabla thead th {
            padding: 14px 18px;
            font-family: 'Syne', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-align: center;
        }

        .card-tabla tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        .card-tabla tbody tr:hover { background: #f8faff; }

        .card-tabla tbody td {
            padding: 13px 18px;
            text-align: center;
            font-size: 0.93rem;
            color: #1e293b;
        }

        .badge-estado {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .badge-disponible { background: #dcfce7; color: #166534; }
        .badge-agotado { background: #fee2e2; color: #991b1b; }

        .badge-categoria {
            background: #ede9fe;
            color: #5b21b6;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .btn-edit, .btn-delete {
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-edit { background: #fef9c3; color: #854d0e; }
        .btn-edit:hover { background: #fde68a; }
        .btn-delete { background: #fee2e2; color: #991b1b; }
        .btn-delete:hover { background: #fca5a5; }

        .btn-agregar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-family: 'Syne', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(13,110,253,0.25);
        }

        .btn-agregar:hover { background: #0b5ed7; transform: translateY(-1px); }

        /* FORMULARIO */
        .card-form {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            padding: 32px;
            animation: slideDown 0.25s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .form-title {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--dark);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label {
            font-weight: 500;
            font-size: 0.88rem;
            color: #475569;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border-radius: 8px;
            border: 1.5px solid var(--border);
            padding: 10px 14px;
            font-size: 0.93rem;
            transition: border 0.2s;
            width: 100%;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13,110,253,0.1);
            outline: none;
        }

        .btn-guardar {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 11px 28px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-guardar:hover { background: #0b5ed7; }

        .btn-cancelar {
            background: #f1f5f9;
            color: #475569;
            border: none;
            border-radius: 10px;
            padding: 11px 24px;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cancelar:hover { background: #e2e8f0; }

        .hidden { display: none; }
        .nueva-categoria-wrap { margin-top: 8px; }
    </style>
</head>
<body>

<div class="wrapper">

    <div class="header">
    <h2>Gestión de <span>Productos</span></h2>
    </div>
    <!-- VISTA TABLA -->
    <div id="vistaTabla">

        <!-- BUSCADOR -->
        <div class="buscador-wrap">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" id="busqueda" placeholder="Buscar producto por nombre...">
        </div>

        <div class="card-tabla">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos"></tbody>
            </table>
        </div>

        <div style="text-align:center;">
            <button class="btn-agregar" onclick="mostrarFormulario()">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
                Agregar Producto
            </button>
        </div>
    </div>

    <!-- VISTA FORMULARIO -->
    <div id="vistaFormulario" class="hidden">
        <div class="card-form">
            <div class="form-title">
                <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
                <span id="formTitulo">Nuevo Producto</span>
            </div>

            <form id="productoForm">
                <input type="hidden" id="indice">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Ej: Laptop Lenovo" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Descripción</label>
                        <input type="text" id="descripcion" class="form-control" placeholder="Breve descripción" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Categoría</label>
                        <select id="categoria" class="form-select"></select>
                        <div class="nueva-categoria-wrap">
                            <input type="text" id="nuevaCategoria" class="form-control hidden" placeholder="Nombre de nueva categoría...">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Precio ($)</label>
                        <input type="number" id="precio" class="form-control" placeholder="0.00" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Stock</label>
                        <input type="number" id="stock" class="form-control" placeholder="0" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Estado</label>
                        <select id="estado" class="form-select">
                            <option value="Disponible">Disponible</option>
                            <option value="Agotado">Agotado</option>
                        </select>
                    </div>

                    <div class="col-12 d-flex gap-2 mt-2">
                        <button type="submit" class="btn-guardar">Guardar</button>
                        <button type="button" class="btn-cancelar" onclick="cancelarFormulario()">Cancelar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="app.js"></script>

</body>
</html>
